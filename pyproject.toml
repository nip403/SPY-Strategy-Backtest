[project]
name = "spy-momentum-strategy-backtest"
version = "0.1.0"
description = "Intraday noise-area breakout backtesting engine for SPY, with pluggable cost models, portfolio decomposition, and marginal strategy-integration analysis."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Nip403" },
]
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.11",
    "matplotlib>=3.8",
    "statsmodels>=0.14",
    "alpaca-py>=0.33",
]
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["backtest_engine"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: builds large/multi-day datasets or heavier smoke tests; select with -m slow",
    "fast: everything else (auto-applied in conftest.py); select with -m fast for a quick loop",
]